```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #243b55;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #141e30;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px #ddd;
        }

        h2 {
            margin-bottom: 20px;
            color: #243b55;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #243b55;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #141e30;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #243b55;

        }

        .delete-btn {
            background: #dc3545;
            margin: 0;

        }

        footer {
            text-align: center;
            padding: 18px;
            background: #243b55;
            color: white;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            nav a {
                margin: 0 6px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Manage Student Records Easily</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="student.html">Students</a>
</nav>

<div class="container">

    <section class="card">
        <h2>Register New Student</h2>

        <form id="studentForm">
            <div class="form-grid">
                <input type="text" id="name"
                    placeholder="Student Name" required>

                <input type="email" id="email"
                    placeholder="Email Address" required>

                <input type="text" id="roll"
                    placeholder="Roll Number" required>

                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="MBA">MBA</option>
                    <option value="B.Sc">B.Sc</option>
                </select>

                <input type="number" id="year"
                    placeholder="Year of Study" min="1" max="6" required>

                <input type="tel" id="phone"
                    placeholder="Phone Number" required>
            </div>

            <button type="submit">Add Student</button>
        </form>
    </section>

    <section class="card">
        <h2>Student Records</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Roll No.</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <tr>
                        <td colspan="7">No student records available.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>

<footer>
    <p>&copy; 2026 Student Management System</p>
</footer>

<script>
    const form = document.getElementById("studentForm");
    const table = document.getElementById("studentTable");

    // Store student records in the browser
    let students = [];

    function displayStudents() {
        table.replaceChildren();

        if (students.length === 0) {
            const row = table.insertRow();
            const cell = row.insertCell();
            cell.colSpan = 7;
            cell.textContent = "No student records available.";
            return;
        }

        students.forEach((student, index) => {
            const row = table.insertRow();

            [
                student.roll,
                student.name,
                student.email,
                student.course,
                student.year,
                student.phone
            ].forEach(value => {
                const cell = row.insertCell();
                cell.textContent = value;
            });

            const actionCell = row.insertCell();
            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";

            deleteButton.addEventListener("click", () => {
                students.splice(index, 1);
                displayStudents();
            });

            actionCell.appendChild(deleteButton);
        });
    }

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const student = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            roll: document.getElementById("roll").value.trim(),
            course: document.getElementById("course").value,
            year: document.getElementById("year").value,
            phone: document.getElementById("phone").value.trim()
        };

        if (students.some(s => s.roll === student.roll)) {
            alert("This roll number already exists!");
            return;
        }

        students.push(student);
        displayStudents();
        form.reset();

        alert("Student added successfully!");
    });

    displayStudents();
</script>

</body>
</html>
